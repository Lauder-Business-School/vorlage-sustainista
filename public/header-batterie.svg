  <rect class="cellb hl" x="1020.8" y="222" width="67.2" height="156" rx="10" style="animation-delay:2.4s"/>
  <path class="bolt" d="M908.0 256 L878.0 306.0 H902.0 L890.0 344 L926.0 292.0 H904.0 Z"/>
  <path class="track" d="M-20 470 H240 V430 H420 V450 H560 V330 H700"/>
