  <path class="snake " pathLength="1000" style="stroke-dasharray: 90 910; animation-duration: 10s; animation-delay: 0s;" d="M-20 470 H240 V430 H420 V450 H560 V330 H700"/>
  <path class="track moss" d="M-20 130 H300 V170 H520 V150 H600 V270 H700"/>
  <path class="halo" pathLength="1000" style="stroke-dasharray: 90 910; animation-duration: 14s; animation-delay: -3s;" d="M-20 130 H300 V170 H520 V150 H600 V270 H700"/>
  <path class="snake moss" pathLength="1000" style="stroke-dasharray: 90 910; animation-duration: 14s; animation-delay: -3s;" d="M-20 130 H300 V170 H520 V150 H600 V270 H700"/>
  <circle class="node solid" cx="700" cy="330" r="5"/>
