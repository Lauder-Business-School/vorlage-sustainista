  <style>
    .track { stroke: #4f772d; stroke-opacity: .28; stroke-width: 1.5; stroke-linejoin: round; fill: none; }
    .track.moss { stroke: #90a955; stroke-opacity: .4; }
    .halo { stroke: #90a955; stroke-opacity: .28; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; animation: run 12s linear infinite; }
    .snake { stroke: #4f772d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; animation: run 12s linear infinite; }
    .snake.deep { stroke: #31572c; }
    .snake.moss { stroke: #90a955; }
    .node { fill: #f8faf5; stroke: #4f772d; stroke-opacity: .85; stroke-width: 2; }
    .node.solid { fill: #4f772d; stroke: #f8faf5; }
    .pulse { fill: none; stroke: #4f772d; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; }
    .tag rect { fill: #f8faf5; stroke: #4f772d; stroke-opacity: .45; }
    .tag text, .lbl { fill: #31572c; font: 700 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: .06em; }
    .lbl.soft { fill: #4f772d; fill-opacity: .6; font-weight: 600; }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0% { transform: scale(1); stroke-opacity: .7; } 100% { transform: scale(5); stroke-opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: .18; } 40%, 60% { opacity: 1; } }
    @keyframes rise { 0% { transform: scaleY(0); } 18%, 82% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinr { to { transform: rotate(-360deg); } }
    @keyframes charge { 0%, 8% { opacity: .12; } 22%, 88% { opacity: 1; } 100% { opacity: .12; } }

    .cell { fill: #4f772d; animation: blink 6s ease-in-out infinite; }
    .cell.on { fill: #31572c; animation: none; opacity: .9; }
    .finder { fill: none; stroke: #31572c; stroke-width: 7; stroke-opacity: .9; }
    .frame { fill: #f8faf5; fill-opacity: .55; stroke: #4f772d; stroke-opacity: .35; stroke-width: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .halo, .pulse { opacity: 0; }
      .snake { stroke-dasharray: none !important; stroke-opacity: .5; }
    }
  </style>
