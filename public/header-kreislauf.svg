  <path class="snake " pathLength="1000" style="stroke-dasharray: 110 140; animation-duration: 14s; animation-delay: 0s;" d="M1120 310 A250 250 0 1 1 620 310 A250 250 0 1 1 1120 310"/>
  <circle class="node solid" cx="870" cy="310" r="9"/>
